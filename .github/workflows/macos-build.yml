name: macOS Build

# 无 mac 机器时的出包路径：推送到本分支/手动触发即用 GitHub 的 macOS runner
# 构建出 .app + .dmg，作为 artifact 下载分发。
# 首次接入需要把仓库推到 GitHub（private 免费，Actions 免费额度足够）。
on:
  workflow_dispatch:
  push:
    branches: [feature/macos-port, main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # macos runner 自带 Xcode 命令行工具；rust 需显式安装
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # cargo tauri 命令来自 tauri-cli，需先安装（源码编译，较慢但一次性）
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install frontend deps
        run: cd gui && bun install

      # beforeBuildCommand (bun run build = tsc + vite build) 由 cargo tauri build 自动触发
      - name: Build GUI (.app + .dmg)
        run: cd gui/src-tauri && cargo tauri build --bundles dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-macos
          path: |
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/macos/*.app
