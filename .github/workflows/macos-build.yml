name: macOS Build

# ⚠️ 已停用（2026-09-14）：mac 构建改走 Codemagic 平台，本 workflow 不再使用。
#    仓库里保留仅为历史参考 —— 别指望推送触发它，产物不会在这里出现。
#    （历史上它是"无 mac 机器时的出包路径"，GitHub runner 出包较慢。）
#
# 无 mac 机器时的出包路径：推送到本分支/手动触发即用 GitHub 的 macOS runner
# 完整跑 build.ts --platform macos 管线（不再是只 cargo tauri build）：
#   claude 二进制(bun-darwin-arm64) + GUI(.app) + 自包含 bun/tools/python 下载
#   + 组件 zip 打包 + manifest。产物作为 artifact 下载分发。
on:
  workflow_dispatch:
  push:
    branches: [feature/macos-port, main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # cargo tauri 命令来自 tauri-cli，需先安装（源码编译，较慢但一次性）
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install deps
        run: |
          bun install
          cd gui && bun install

      # build.ts 完整 mac 管线：--platform macos 走 mac 分支（darwin 目标/系统 zip/
      # python pkg 解包），--release 生成 manifest + 组件 zip
      - name: Full macOS build (build.ts --platform macos)
        run: |
          bun run scripts/build.ts --platform macos --release ci-build --notes "macOS CI build"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-macos
          path: |
            dist/Claude Code.app
            dist/claude
            dist/release/ci-build/manifest.json
            dist/release/ci-build/*.zip
