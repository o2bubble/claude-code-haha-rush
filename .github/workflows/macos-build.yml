name: macOS Build

# macOS 构建（GitHub Actions）。本仓库是 public → macOS runner **免费不限分钟**，
# 可替代按分钟付费的 Codemagic。
#
# 触发：推送到 main，或在 Actions 页手动 Run workflow。
# 产物：当前 run 底部的 artifact「claude-code-macos」。
#
# ⚠️ **必须 arm64 runner** —— build.ts 整条 mac 链路硬编码 aarch64
#    （claude 编译目标 `bun-darwin-arm64`；bun/rg/fd/shellcheck 下 aarch64 包；
#     python 用 `aarch64-apple-darwin`；playbook 明确"只出 arm64"）。
#    用 x86_64 runner（macos-13）时 `cargo tauri build` 会编出 x86_64 的 .app，
#     与其余 arm64 组件不匹配 → 装完起不来。
#    macos-14 / macos-15 = Apple Silicon；macos-13 = Intel；macos-latest 不保证，
#     故**显式钉版本**，且加一步架构自检。
#
# ⚠️ 本仓库是 **public** —— Actions 日志与 artifact 对所有人可见/可下载，
#    即 mac 安装包（含完整 .app）会公开。构建本身只用公开 URL
#    （build.ts 下 bun/python/tools 均无需 token），无凭据泄露面。
on:
  workflow_dispatch:
  push:
    branches: [main]

# 连推两次时取消旧的 —— 省时间，也避免 artifact 来自已被取代的代码
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # arm64（M1）—— 见文件头，勿改成 macos-13 / macos-latest
    runs-on: macos-14
    # 完整管线约 13 分钟（Codemagic 实测 11m50s~14m40s），Tauri CLI 首次编译更久
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 架构自检：不对劲就早失败，别编出 x86_64 的包还看不出来
      - name: Verify arm64 runner
        run: |
          echo "runner arch: $(uname -m)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::需要 arm64 runner（macos-14/15），当前是 $(uname -m)"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # cargo tauri 来自 tauri-cli；GitHub runner 每次都是干净的，故每次都要源码编译
      # （这是本 workflow 最耗时的一步，约 3-6 分钟）
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install deps
        run: |
          bun install
          cd gui && bun install

      # build.ts 完整 mac 管线：--platform macos 走 mac 分支（darwin 目标 / 系统 zip /
      # python-build-standalone 解包），--release 生成 manifest + 组件 zip
      - name: Full macOS build (build.ts --platform macos)
        run: |
          bun run scripts/build.ts --platform macos --release ci-build --notes "macOS CI build"

      # 产物自检：关键文件缺失直接失败，别让下游下到残缺的包
      - name: Verify artifacts
        run: |
          set -e
          APP="dist/Claude Code.app/Contents/MacOS"
          test -f "$APP/claude" || { echo "::error::缺 claude 二进制"; exit 1; }
          test -f "$APP/claude-gui-server" || { echo "::error::缺 claude-gui-server（GUI server 未内嵌）"; exit 1; }
          # 可执行位：历史上解压/打包丢过 +x，导致装完引擎起不来
          test -x "$APP/claude" || { echo "::error::claude 缺可执行位"; exit 1; }
          echo "组件 zip："
          ls -lh dist/release/ci-build/*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-macos
          # 只传 build.ts 打的 zip。**不要**传 dist/Claude Code.app 那棵树
          # （GitHub 自动打的目录 zip 不保留 symlink，装完起不来 —— playbook 记过）
          path: |
            dist/release/ci-build/manifest.json
            dist/release/ci-build/*.zip
          if-no-files-found: error
          retention-days: 14
