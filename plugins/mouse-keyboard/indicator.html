<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 操作中</title>
<style>
  /* 小指示窗：置顶、无装饰、不可激活（点它不会抢焦点）。
     尺寸约 300×132，做成两行信息 + 最近动作 + 一行汇总 —— 尽量少遮挡。
     整体可拖动（-webkit-app-region: drag），按钮单独排除。 */
  :root {
    --bg: rgba(16, 17, 22, .92);
    --fg: #d7dbe4;
    --fg-dim: #8a90a0;
    --accent: #58c4e8;
    --danger: #e2564f;
    --ok: #4caf7d;
    --border: rgba(255, 255, 255, .10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font: 11px/1.35 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    border: 1px solid var(--border); border-radius: 8px;
    display: flex; flex-direction: column; padding: 7px 9px; gap: 4px;
    -webkit-app-region: drag;           /* 整窗可拖 */
    user-select: none;
  }

  .row { display: flex; align-items: center; gap: 6px; }
  .spacer { flex: 1; }

  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  #dot.busy { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  #dot.stopped { background: var(--danger); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  /* 标题可被压缩（两个按钮 + 标题在 300px 里要放得下） */
  #title { font-weight: 600; font-size: 11.5px; white-space: nowrap; overflow: hidden; }

  #stop {
    -webkit-app-region: no-drag;        /* 按钮不参与拖窗 */
    flex-shrink: 0; cursor: pointer;
    font: inherit; font-size: 11px; padding: 2px 9px;
    border-radius: 5px; border: 1px solid var(--danger);
    background: rgba(226, 86, 79, .18); color: var(--danger);
  }
  #stop:hover:not(:disabled) { background: rgba(226, 86, 79, .32); }
  #stop:disabled { opacity: .4; cursor: default; }

  /* 关闭按钮 —— 与「停止」语义**不同**：停止是停 AI 的操作，关闭只是收起这个窗口 */
  #close {
    -webkit-app-region: no-drag;
    flex-shrink: 0; cursor: pointer;
    font: inherit; font-size: 14px; line-height: 1;
    padding: 2px 7px; border-radius: 5px;
    border: 1px solid var(--border); background: transparent;
    color: var(--fg-dim);
  }
  #close:hover { color: var(--fg); border-color: var(--fg-dim); background: rgba(255, 255, 255, .07); }

  #current {
    color: var(--accent); font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-height: 15px;
  }
  #current.idle { color: var(--fg-dim); }

  #log { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 1px; }
  #log div {
    color: var(--fg-dim); font-size: 10.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #log div:first-child { color: var(--fg); }

  #foot { color: var(--fg-dim); font-size: 10px; display: flex; gap: 6px; }
  kbd {
    font-family: inherit; font-size: 9.5px; padding: 0 3px;
    border: 1px solid var(--border); border-radius: 3px; color: var(--fg-dim);
  }
</style>
</head>
<body>
<div class="row">
  <span id="dot" class="busy"></span>
  <span id="title">AI 操作中</span>
  <span class="spacer"></span>
  <button id="stop" title="立即停止 AI 的操作">■ 停止</button>
  <button id="close" title="关闭此窗口（不影响 AI 的操作状态）">✕</button>
</div>

<div id="current">连接中…</div>

<div id="log"></div>

<div id="foot">
  <span id="stat">—</span>
  <span class="spacer"></span>
  <span><kbd id="hk">—</kbd> 急停</span>
</div>

<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var PORT = q.get("port");
  var API = PORT ? "http://127.0.0.1:" + PORT : null;
  var SOURCE = "plugin:viewer:mouse-keyboard";

  var dot = document.getElementById("dot");
  var title = document.getElementById("title");
  var stopBtn = document.getElementById("stop");
  var curEl = document.getElementById("current");
  var logEl = document.getElementById("log");
  var statEl = document.getElementById("stat");
  var hkEl = document.getElementById("hk");

  /**
   * 打开后**至少**显示这么久（从"最后一次操作"算起）。
   *
   * ⚠️ 这个必须有，否则窗口打开即开始倒计时：`open-indicator` 是随工具**响应**
   * 返回的，也就是"操作已经做完"时窗口才打开 —— 此刻就是空闲状态，立刻开始倒计时，
   * 几秒后自己关掉。实测日志：开 → 10 秒后关 → 再开 → 9 秒后关，用户看到的就是
   * "闪一下就没了"（用户报的第一句话就是这个）。
   *
   * 取 30 秒：AI 干活的节奏是"几个动作 → 想几秒 → 再来几个"，8 秒太短（窗口会在
   * 两次操作之间消失、下次操作又冒出来一顿闪）；30 秒能让一段连续工作期间窗口
   * **稳定在屏幕上**，真正收工后才消失。
   */
  var MIN_SHOW_MS = 30000;

  var openedAt = Date.now();
  var lastBusyAt = Date.now();
  var closed = false;

  function toHost(kind, payload) {
    try { parent.postMessage({ source: SOURCE, kind: kind, payload: payload }, "*"); } catch (e) {}
  }

  function render(s) {
    var busy = !!s.currentAction;
    var stopped = !!s.aborted;

    dot.className = busy ? "busy" : (stopped ? "stopped" : "");
    title.textContent = stopped ? "已停止" : (busy ? "AI 操作中" : "AI 空闲");
    stopBtn.disabled = stopped;

    // 窗口多半是"操作刚做完"才打开的（见 MIN_SHOW_MS 注释）—— 空闲时显示
    // **刚才做了什么**，而不是"等待 AI 操作…"（那个读起来像还没开始）。
    var last = (s.log && s.log[0]) ? s.log[0].text : "";
    var justNow = s.lastActivityMs !== null && s.lastActivityMs !== undefined && s.lastActivityMs < 60000;
    curEl.textContent = stopped
      ? ("已急停（" + (s.abortReason || "原因未知") + "）")
      : (busy ? s.currentAction
        : (justNow && last ? "刚完成：" + last : "等待 AI 操作…"));
    curEl.className = busy || stopped ? "" : "idle";

    if (s.hotkey) hkEl.textContent = s.hotkey;

    // 最近动作（新的在前）
    logEl.textContent = "";
    var items = (s.log || []).slice(0, 3);
    if (!items.length) {
      var d = document.createElement("div");
      d.textContent = "（还没有动作）";
      logEl.appendChild(d);
    } else {
      for (var i = 0; i < items.length; i++) {
        var d = document.createElement("div");
        d.textContent = (i === 0 ? "› " : "  ") + items[i].text;
        logEl.appendChild(d);
      }
    }

    var secs = Math.round((s.uptimeMs || 0) / 1000);
    statEl.textContent = "累计 " + (s.count || 0) + " 个动作 · " + fmtDur(secs);

    // 空闲判定：**从"最后一次活动"起算**（不是从打开时刻）—— 只要 AI 还在动就把
    // 时钟往后推，停手满 MIN_SHOW_MS 才关。这样连续工作期间窗口稳定在屏幕上，
    // 真正收工后约半分钟安静地淡出。
    var now = Date.now();
    if (busy || stopped) lastBusyAt = now;
    else if (now - lastBusyAt > MIN_SHOW_MS) closeSelf();
  }

  function fmtDur(sec) {
    if (sec < 60) return sec + "s";
    if (sec < 3600) return Math.floor(sec / 60) + "m" + (sec % 60) + "s";
    return Math.floor(sec / 3600) + "h" + Math.floor((sec % 3600) / 60) + "m";
  }

  /**
   * 自己请求宿主关掉（本窗口是宿主开的，自己关不了）。
   * 先做一个淡出，再请求关闭 —— 硬消失太突兀。
   */
  function closeSelf() {
    if (closed) return;
    closed = true;
    clearInterval(timer);
    document.body.style.transition = "opacity .45s ease";
    document.body.style.opacity = "0";
    setTimeout(function () { toHost("close-indicator"); }, 460);
  }

  // 关闭窗口 —— 只是收起它，**不改 AI 的操作状态**（要停 AI 请点左边的「停止」）。
  // 下次 AI 开始操作时窗口会再出现（那是这个浮标的意义）；完全不想看到它就去
  // 设置里关掉「AI 操作时显示浮动指示窗」。
  document.getElementById("close").onclick = function () { closeSelf(); };

  stopBtn.onclick = function () {
    if (!API) return;
    fetch(API + "/abort", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
      .then(function (r) { return r.json(); })
      .then(function () { lastBusyAt = Date.now(); tick(); })
      .catch(function () {});
  };

  function tick() {
    if (!API) { curEl.textContent = "缺少端口参数"; return; }
    fetch(API + "/activity")
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s && s.ok) render(s);
      })
      .catch(function () {
        // 插件进程没了（禁用/崩溃）→ 自己收起来，别留一个孤零零的窗口
        if (!closed) { closed = true; clearInterval(timer); toHost("close-indicator"); }
      });
  }

  var timer = setInterval(tick, 600);
  tick();

  // 主题跟随（宿主推来）
  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.source !== "plugin:host") return;
    if (d.kind === "theme" && d.payload && d.payload.theme === "light") {
      document.body.style.background = "rgba(250,250,252,.95)";
      document.body.style.color = "#1f2430";
    }
  });
})();
</script>
</body>
</html>
