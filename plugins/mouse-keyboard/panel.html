<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鼠标键盘</title>
<style>
  :root {
    --bg-root: #0e0e12; --bg-card: #16161d; --bg-hover: #1d1e28; --bg-subtle: #1a1a22;
    --fg-primary: #cdd1da; --fg-secondary: #8f94a1; --fg-muted: #5c6272;
    --border-light: #242533; --border-medium: #3a3b4c;
    --accent: #58c4e8; --danger: #d9534f; --warn: #d9a441; --success: #4caf7d;
  }
  [data-theme="light"] {
    --bg-root: #f7f8fa; --bg-card: #fff; --bg-hover: #eef0f4; --bg-subtle: #f0f2f5;
    --fg-primary: #1f2430; --fg-secondary: #5a6072; --fg-muted: #8a90a0;
    --border-light: #e2e5ec; --border-medium: #c8ccd6;
    --accent: #1a8cb8; --danger: #c9302c; --warn: #b8860b; --success: #2e7d52;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg-root); color: var(--fg-primary);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border-light); flex-shrink: 0;
  }
  .badge {
    padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600;
    background: color-mix(in srgb, var(--success) 20%, transparent); color: var(--success);
  }
  .badge.stopped { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }
  .spacer { flex: 1; }
  .muted { color: var(--fg-muted); font-size: 11px; }

  main { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--bg-card); border: 1px solid var(--border-light);
    border-radius: 8px; padding: 12px;
  }
  .card h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--fg-secondary); }

  /* 急停区 */
  #stop {
    width: 100%; padding: 18px; font-size: 17px; font-weight: 700; cursor: pointer;
    border-radius: 10px; border: 2px solid var(--danger);
    background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger);
    transition: background .15s;
  }
  #stop:hover { background: color-mix(in srgb, var(--danger) 28%, transparent); }
  #stop:disabled { opacity: .45; cursor: default; }
  #stop:disabled:hover { background: color-mix(in srgb, var(--danger) 16%, transparent); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row button { flex: 1; }

  button {
    font: inherit; font-size: 12px; padding: 7px 12px; cursor: pointer;
    border-radius: 6px; border: 1px solid var(--border-medium);
    background: var(--bg-hover); color: var(--fg-primary);
  }
  button:hover:not(:disabled) { filter: brightness(1.18); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { border-color: var(--accent); color: var(--accent); }

  /* 状态行 */
  .kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; font-size: 12px; }
  .kv dt { color: var(--fg-muted); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }

  /* 测试区 */
  #coords {
    font-family: ui-monospace, Consolas, monospace; font-size: 15px;
    color: var(--accent); font-variant-numeric: tabular-nums;
  }
  input[type="text"] {
    width: 100%; padding: 6px 8px; font: inherit; font-size: 12px;
    border-radius: 6px; border: 1px solid var(--border-medium);
    background: var(--bg-subtle); color: var(--fg-primary);
  }
  .hint { font-size: 11px; color: var(--fg-muted); margin-top: 6px; line-height: 1.6; }
  kbd {
    padding: 1px 5px; border-radius: 3px; font-size: 11px; font-family: inherit;
    border: 1px solid var(--border-medium); background: var(--bg-subtle);
    color: var(--fg-secondary);
  }
</style>
</head>
<body>
<header>
  <span id="badge" class="badge">就绪</span>
  <span id="action" class="muted"></span>
  <span class="spacer"></span>
  <span id="dir" class="muted"></span>
</header>

<main>
  <div class="card">
    <button id="stop">■ 立即停止 AI 操作</button>
    <div class="row">
      <button id="resume" class="primary">解除急停</button>
      <button id="release">释放全部按键/按钮</button>
    </div>
    <div class="hint">
      任何时候按住 <kbd id="hk">ctrl+alt+shift+f12</kbd> 也能立即停止（不需要本窗口在前台）。
      若某个按键或鼠标按钮卡在"按下"状态，点「释放全部」。
    </div>
  </div>

  <div class="card">
    <h3>状态</h3>
    <dl class="kv">
      <dt>鼠标位置</dt><dd id="mouse">—</dd>
      <dt>按住中</dt><dd id="held">无</dd>
      <dt>防误点本窗口</dt><dd id="blockhost">—</dd>
      <dt>急停原因</dt><dd id="reason">—</dd>
    </dl>
  </div>

  <div class="card">
    <h3>测试（手动验证插件是否正常）</h3>
    <div id="coords">—</div>
    <div class="row">
      <button id="tmove">移到 (640, 400)</button>
      <button id="tclick">在此处单击</button>
    </div>
    <div class="row">
      <input type="text" id="ttext" placeholder="要输入的文字（支持中文）">
      <button id="ttype" style="flex:0 0 88px">输入</button>
    </div>
    <div class="hint">
      输入测试请先把光标点到能接收文字的地方（如本窗口的输入框、记事本）。
      中文输入走 Unicode 直发，绕过输入法。
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";
  // 与其它插件面板同一套：宿主把插件进程端口拼进 URL query，主题经 postMessage 推来。
  var q = new URLSearchParams(location.search);
  var PORT = q.get("port");
  var API = PORT ? "http://127.0.0.1:" + PORT : null;

  var badge = document.getElementById("badge");
  var actionEl = document.getElementById("action");
  var dirEl = document.getElementById("dir");
  var mouseEl = document.getElementById("mouse");
  var heldEl = document.getElementById("held");
  var blockEl = document.getElementById("blockhost");
  var reasonEl = document.getElementById("reason");
  var coordsEl = document.getElementById("coords");
  var stopBtn = document.getElementById("stop");
  var resumeBtn = document.getElementById("resume");
  var releaseBtn = document.getElementById("release");

  var lastText = "";

  function post(path, body) {
    if (!API) return Promise.reject(new Error("插件进程端口未知"));
    return fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    }).then(function (r) { return r.json(); });
  }

  function render(s) {
    var stopped = !!s.aborted;
    badge.textContent = stopped ? "已急停" : "就绪";
    badge.className = "badge" + (stopped ? " stopped" : "");
    stopBtn.disabled = stopped;
    resumeBtn.disabled = !stopped;

    actionEl.textContent = s.currentAction ? "正在执行：" + s.currentAction : "";
    dirEl.textContent = s.hostPidKnown === false ? "（未注入宿主 PID）" : "";

    mouseEl.textContent = s.mouse ? s.mouse.x + ", " + s.mouse.y : "—";
    var held = [].concat(s.heldKeys || [], s.heldButtons || []);
    heldEl.textContent = held.length ? held.join("、") : "无";
    blockEl.textContent = s.blockHostWindows ? "已开启" : "已关闭";
    reasonEl.textContent = s.abortReason || "—";

    if (s.abortHotkey) document.getElementById("hk").textContent = s.abortHotkey;
  }

  function refresh() {
    if (!API) {
      badge.textContent = "进程未就绪";
      badge.className = "badge stopped";
      return;
    }
    fetch(API + "/status")
      .then(function (r) { return r.json(); })
      .then(function (s) {
        render(s);
        // 测试区实时显示鼠标坐标（兼作"DIP 缩放是否导致偏移"的人工验证）
        if (s.mouse) coordsEl.textContent = s.mouse.x + ", " + s.mouse.y;
      })
      .catch(function () {
        badge.textContent = "进程未响应";
        badge.className = "badge stopped";
      });
  }

  stopBtn.onclick = function () {
    post("/abort").then(refresh).catch(function (e) { alert2(String(e.message || e)); });
  };
  resumeBtn.onclick = function () {
    post("/resume").then(refresh);
  };
  releaseBtn.onclick = function () {
    post("/release").then(refresh);
  };

  // 测试区：直接打插件的 __mcp 端点（与 AI 走同一条路，验证的是同一条链路）
  function call(action, args) {
    return post("/__mcp", { tool: "control", args: Object.assign({ action: action }, args || {}) })
      .then(function (r) {
        lastText = r && r.ok ? "成功" : ("失败：" + ((r && r.error) || "未知"));
        refresh();
      });
  }

  document.getElementById("tmove").onclick = function () { call("move", { x: 640, y: 400 }); };
  document.getElementById("tclick").onclick = function () { call("click"); };

  var ttext = document.getElementById("ttext");
  document.getElementById("ttype").onclick = function () {
    var t = ttext.value;
    if (!t) return;
    call("type", { text: t });
  };

  // 面板里没有 allow-modals（sandbox），用状态行代替 alert
  function alert2(msg) {
    actionEl.textContent = msg;
    setTimeout(function () { actionEl.textContent = ""; }, 3000);
  }

  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.source !== "plugin:host") return;
    if (d.kind === "theme" && d.payload && d.payload.theme) {
      document.documentElement.dataset.theme = d.payload.theme === "light" ? "light" : "dark";
    }
  });

  refresh();
  setInterval(refresh, 1000);
})();
</script>
</body>
</html>
