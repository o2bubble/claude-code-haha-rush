<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>截屏</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg-root, #0e0e12); color: var(--fg-primary, #cdd1da);
    font: 13px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
  }
  header {
    padding: 10px 12px; border-bottom: 1px solid var(--border-light, #242533);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-shrink: 0;
  }
  button {
    font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border-medium, #3a3b4c);
    background: var(--bg-hover, #1d1e28); color: inherit;
  }
  button:hover { filter: brightness(1.25); }
  button.primary {
    background: var(--accent, #58c4e8); color: var(--bg-root, #0e0e12);
    border-color: transparent; font-weight: 600;
  }
  button:disabled { opacity: .45; cursor: default; }
  select {
    font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 6px;
    background: var(--bg-hover, #1d1e28); color: inherit;
    border: 1px solid var(--border-medium, #3a3b4c);
  }
  .spacer { flex: 1; }
  .muted { color: var(--fg-muted, #5c6272); font-size: 11px; }

  #body { flex: 1; overflow: auto; padding: 10px 12px; }
  #grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .card {
    border: 1px solid var(--border-light, #242533); border-radius: 8px; overflow: hidden;
    background: var(--bg-surface, #15161d); cursor: pointer; position: relative;
  }
  .card:hover { border-color: var(--accent, #58c4e8); }
  .card img { display: block; width: 100%; height: 96px; object-fit: cover; background: #000; }
  .card .meta { padding: 5px 7px; font-size: 10px; color: var(--fg-muted, #5c6272); }
  .card .name { color: var(--fg-secondary, #8f94a1); overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .card .acts { display: none; position: absolute; inset: auto 0 0 0; padding: 5px;
                gap: 3px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  /* 2×2 而非单行 flex：卡片最窄只有 150px，4 个按钮单行放不下会各自换行成
     一列（很难看），网格则始终整齐。 */
  .card:hover .acts { display: grid; grid-template-columns: 1fr 1fr; }
  .card .acts button { font-size: 10px; padding: 3px 4px; min-width: 0;
                       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 多选删除 */
  .card .check { position: absolute; top: 6px; left: 6px; width: 18px; height: 18px;
                 border-radius: 4px; border: 1.5px solid rgba(255,255,255,.85);
                 background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 1;
                 display: none; align-items: center; justify-content: center; }
  body.select-mode .card .check { display: flex; }
  .card.sel { border-color: var(--accent, #58c4e8);
              box-shadow: 0 0 0 2px var(--accent, #58c4e8) inset; }
  .card.sel .check { background: var(--accent, #58c4e8); border-color: var(--accent, #58c4e8);
                     color: var(--bg-root, #0e0e12); }
  button.danger { background: #b3382f; border-color: #b3382f; color: #fff; }
  button.danger:hover { filter: brightness(1.2); }
  .empty { color: var(--fg-muted, #5c6272); text-align: center; padding: 40px 12px; }
  #status { padding: 6px 12px; font-size: 11px; color: var(--fg-muted, #5c6272);
            border-top: 1px solid var(--border-light, #242533); flex-shrink: 0; min-height: 16px; }

</style>
</head>
<body>
<header id="mainbar">
  <button id="region" class="primary">区域</button>
  <button id="fullscreen">全屏</button>
  <button id="window" title="移动鼠标到目标窗口上，点击截取">窗口</button>
  <select id="dest" title="截完直接送到哪里">
    <option value="chat">→ 聊天输入框</option>
    <option value="desktop">→ 超级桌面</option>
    <option value="file">→ 仅保存</option>
  </select>
  <span class="spacer"></span>
  <span class="muted" id="dir"></span>
  <button id="select" title="多选后批量删除">选择</button>
  <button id="refresh" title="重新扫描截图目录">刷新</button>
</header>

<!-- 多选模式的工具条（与上面那条互斥显示） -->
<header id="selbar" style="display:none">
  <span id="selcount" class="muted">已选 0 张</span>
  <span class="spacer"></span>
  <button id="selall">全选</button>
  <button id="delsel" class="danger">删除选中</button>
  <button id="selcancel">取消</button>
</header>

<div id="body">
  <div id="grid"></div>
  <div class="empty" id="empty" style="display:none">还没有截图。按「区域」试一下，或到设置里给截屏配个快捷键。</div>
</div>
<div id="status"></div>

<script>
const SOURCE = "plugin:viewer:screenshot";   // 上行 source 必须与宿主校验的一致
const q = new URLSearchParams(location.search);
const PORT = Number(q.get("port") || 0);
const API = `http://127.0.0.1:${PORT}`;

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const statusEl = document.getElementById("status");
const destSel = document.getElementById("dest");
const dirEl = document.getElementById("dir");

let busy = false;

// ── 删除 / 多选 ──
//
// ⚠️ 本页在 `sandbox` iframe 里，而宿主给面板的 sandbox **不含 `allow-modals`**
// —— 原生 `confirm()` / `alert()` 会被浏览器**静默忽略**（返回 false 且不报错），
// 拿它做删除确认会变成"点了没反应"。所以确认一律自绘：按钮**二次点击**才执行
// （第一次变成"确认删除?"，3 秒不点自动收回），既不用弹层也不误删。
let selectMode = false;
const selected = new Set();   // 选中的截图 path

function say(msg) { statusEl.textContent = msg; }

/** 上行给宿主（宿主是父窗口）。投递能力在宿主手上，本页只负责请求。 */
function toHost(kind, payload) {
  try { parent.postMessage({ source: SOURCE, kind, payload }, "*"); } catch (e) {}
}

function fmtTime(ms) {
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── 截图 ──
async function capture(mode) {
  if (busy) return;
  if (!PORT) { say("插件进程未就绪"); return; }
  busy = true;
  setButtons(false);
  say(`正在${mode === "region" ? "框选" : "截图"}…`);
  try {
    const res = await fetch(`${API}/capture`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "失败");

    // 区域/窗口模式：进程请宿主开 overlay 交互。投递由 overlay 侧按**插件设置**的
    // 默认去向完成 —— 那时面板的选择器已经插不上手了，所以先把当前选择同步给进程，
    // 让这一单跟着面板走（否则用户在面板选了"→ 桌面"却被送进聊天框，
    // 属于静默违背操作意图）。
    if (data.host && data.host.length) {
      await fetch(`${API}/settings`, {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ settings: { defaultDest: destSel.value } }),
      }).catch(() => {});
      for (const h of data.host) toHost(h.kind, h.payload);
      say(mode === "window" ? "已弹出窗口选择" : "已弹出框选窗口");
      return;
    }
    if (data.cancelled) { say("已取消"); return; }

    // 面板触发的截图：去向由本页的选择器决定（用户看得见）
    const shot = data.shot;
    const dest = destSel.value;
    if (dest === "chat") toHost("chat-reference", { path: shot.path, label: shot.name });
    else if (dest === "desktop") toHost("desktop-image", { path: shot.path, label: shot.name });
    say(`已保存 ${shot.name}（${shot.width}×${shot.height}）${dest === "file" ? "" : "并已投递"}`);
    void load();
  } catch (e) {
    say("失败：" + (e && e.message || e));
  } finally {
    busy = false;
    setButtons(true);
  }
}

function setButtons(on) {
  for (const id of ["region", "fullscreen", "window"]) {
    document.getElementById(id).disabled = !on;
  }
}

// ── 历史 ──
async function load() {
  if (!PORT) { say("插件进程未就绪"); return; }
  try {
    const res = await fetch(`${API}/history`);
    const data = await res.json();
    dirEl.textContent = data.dir || "";
    const items = data.items || [];
    grid.textContent = "";
    empty.style.display = items.length ? "none" : "block";
    for (const it of items) {
      const card = document.createElement("div");
      card.className = "card" + (selected.has(it.path) ? " sel" : "");
      card.dataset.path = it.path;

      const check = document.createElement("div");
      check.className = "check";
      check.textContent = "✓";
      card.appendChild(check);

      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = `${API}/file?path=${encodeURIComponent(it.path)}`;
      img.alt = it.name;
      card.appendChild(img);

      const meta = document.createElement("div");
      meta.className = "meta";
      const nm = document.createElement("div");
      nm.className = "name";
      nm.textContent = it.name;
      const dim = document.createElement("div");
      dim.textContent = `${it.width}×${it.height} · ${fmtTime(it.mtime)}`;
      meta.appendChild(nm); meta.appendChild(dim);
      card.appendChild(meta);

      const acts = document.createElement("div");
      acts.className = "acts";
      acts.appendChild(mkBtn("→ 聊天", () =>
        toHost("chat-reference", { path: it.path, label: it.name })));
      acts.appendChild(mkBtn("→ 桌面", () =>
        toHost("desktop-image", { path: it.path, label: it.name })));
      acts.appendChild(mkBtn("预览", () => openPreview(it)));
      acts.appendChild(mkConfirmBtn("删除", "确认删除?", () => void del([it.path])));
      card.appendChild(acts);

      card.onclick = () => {
        if (selectMode) { toggleSel(it.path); return; }
        toHost("chat-reference", { path: it.path, label: it.name });
      };
      grid.appendChild(card);
    }
    // 选中集合里可能残留已被删掉/移走的文件 —— 清掉，免得"已选 N 张"对不上
    const alive = new Set(items.map((i) => i.path));
    for (const p of [...selected]) if (!alive.has(p)) selected.delete(p);
    refreshSelBar();
    say(`共 ${items.length} 张`);
  } catch (e) {
    say("读取历史失败：" + (e && e.message || e));
  }
}

// ── 卡片操作按钮 ──

/** 普通按钮。`stopPropagation` 是必需的：卡片自身有 onclick（送聊天/多选）。 */
function mkBtn(label, fn) {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = (e) => { e.stopPropagation(); fn(); };
  return b;
}

/** 二次点击确认的按钮（见上方「删除 / 多选」注释：sandbox 里没有原生 confirm）。 */
function mkConfirmBtn(label, confirmLabel, fn) {
  const b = document.createElement("button");
  b.className = "danger";
  b.textContent = label;
  let armed = false;
  let timer = null;
  b.onclick = (e) => {
    e.stopPropagation();
    if (!armed) {
      armed = true;
      b.textContent = confirmLabel;
      timer = setTimeout(() => { armed = false; b.textContent = label; }, 3000);
      return;
    }
    clearTimeout(timer);
    armed = false;
    fn();
  };
  return b;
}

/**
 * 打开独立**预览浮窗**看大图。
 *
 * 为什么不用面板内覆盖层：面板本身多宽，覆盖层就多宽 —— 缩略图看不清的细节
 * 放到覆盖层里还是看不清。浮窗能拉大、能摆到旁边与主界面并排看，这才是"预览"。
 * （走的是插件的通用「打开本插件面板」机制，与 git-viewer 的 diff 浮窗同一套。）
 *
 * ⚠️ 也不能用 `window.open`：面板 iframe 的 sandbox 没有 `allow-popups`，
 * 会被浏览器**静默拦截**（点了没反应、也不报错）。
 */
function openPreview(it) {
  toHost("open-panel", {
    panelId: "preview",
    title: "截图预览",
    width: 900,
    height: 660,
    params: { path: it.path, name: it.name },
  });
}

// ── 选择模式 / 删除 ──

function toggleSel(p) {
  if (selected.has(p)) selected.delete(p); else selected.add(p);
  // 直接改 DOM（不整页重渲染）：截图多时重渲染会闪，且 <img> 会重新加载
  for (const c of grid.children) {
    if (c.dataset.path === p) c.classList.toggle("sel", selected.has(p));
  }
  refreshSelBar();
}

function refreshSelBar() {
  const n = selected.size;
  document.getElementById("selcount").textContent = `已选 ${n} 张`;
  const btn = document.getElementById("delsel");
  btn.disabled = n === 0;
  btn.textContent = `删除选中${n ? ` (${n})` : ""}`;
  const all = grid.children.length;
  document.getElementById("selall").textContent =
    (all > 0 && n === all) ? "取消全选" : "全选";
}

function setSelectMode(on) {
  selectMode = on;
  if (!on) selected.clear();
  document.body.classList.toggle("select-mode", on);
  document.getElementById("mainbar").style.display = on ? "none" : "flex";
  document.getElementById("selbar").style.display = on ? "flex" : "none";
  for (const c of grid.children) c.classList.toggle("sel", selected.has(c.dataset.path));
  refreshSelBar();
}

/** 删除若干张。逐张由进程确认结果 —— 某张被占用不该让整批失败。 */
async function del(paths) {
  if (!paths.length) return;
  try {
    const res = await fetch(`${API}/delete`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paths }),
    });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || "删除失败");
    for (const p of paths) selected.delete(p);
    if (d.failed && d.failed.length) {
      say(`已删除 ${d.deleted.length} 张，${d.failed.length} 张失败（${d.failed[0].error}）`);
    } else {
      say(`已删除 ${d.deleted.length} 张`);
    }
    void load();
  } catch (e) {
    say("删除失败：" + (e && e.message || e));
  }
}

document.getElementById("region").onclick = () => capture("region");
document.getElementById("fullscreen").onclick = () => capture("fullscreen");
document.getElementById("window").onclick = () => capture("window");
document.getElementById("refresh").onclick = () => load();

document.getElementById("select").onclick = () => setSelectMode(true);
document.getElementById("selcancel").onclick = () => setSelectMode(false);

document.getElementById("selall").onclick = () => {
  const all = [...grid.children].map((c) => c.dataset.path);
  const everySel = all.length > 0 && all.every((p) => selected.has(p));
  selected.clear();
  if (!everySel) for (const p of all) selected.add(p);
  for (const c of grid.children) c.classList.toggle("sel", selected.has(c.dataset.path));
  refreshSelBar();
};

document.getElementById("delsel").onclick = () => {
  const btn = document.getElementById("delsel");
  const n = selected.size;
  if (!n) return;
  if (!btn.dataset.armed) {
    btn.dataset.armed = "1";
    btn.textContent = `确认删除 ${n} 张?`;
    setTimeout(() => {
      if (btn.dataset.armed) { delete btn.dataset.armed; refreshSelBar(); }
    }, 3000);
    return;
  }
  delete btn.dataset.armed;
  void del([...selected]);
};

// Esc 退出选择模式（与其它面板一致的习惯）
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && selectMode) setSelectMode(false);
});

// 宿主推送主题（与其它插件面板同一套协议）
window.addEventListener("message", (ev) => {
  const d = ev.data;
  if (!d || d.source !== "plugin:host") return;
  if (d.kind === "theme" && d.payload && d.payload.theme) {
    document.documentElement.dataset.theme = d.payload.theme;
  }
});

setButtons(false);
say(PORT ? "就绪" : "插件进程未就绪（未绑定工作区时不会启动）");
void load().then(() => setButtons(true));
</script>
</body>
</html>
