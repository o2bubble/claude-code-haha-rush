[package]
name = "claude-code-gui"
version = "1.0.0-preview"
edition = "2021"

[package.metadata.windows]
windows-subsystem = "windows"

[lib]
name = "claude_code_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
log = "0.4"
env_logger = "0.11"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
arboard = "3"
zip = "0.6"
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
jsonrpsee = { version = "0.24", features = ["full"] }
tokio = { version = "1", features = ["full"] }
claude-gui-shared = { path = "shared" }
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    # Native process-tree kill (prockill) — replaces spawning taskkill, which
    # pops 0xc0000142 at early logon / during shutdown.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    # 插件挂件的**原生窗口拖拽**（ReleaseCapture）—— 见 start_indicator_drag
    "Win32_UI_Input_KeyboardAndMouse",
] }

# ── 本地 patch：覆盖层透明所需的依赖修复 ──
#
# 为什么 patch：覆盖层（overlay）要真正透明，需要两件事同时成立 ——
#   ① 窗口带 WS_EX_NOREDIRECTIONBITMAP（走 DComp 合成，WebView2 透明背景才生效）
#      ⚠️ 该标志只能在**创建时**设，运行时补设被系统忽略
#   ② 不能再用 softbuffer 给透明窗口铺"防闪烁底色"（XRGB 无 alpha，会把透明盖成实心）
# 上游 tauri-runtime-wry 2.11.4 两点都没做，且 Tauri 未暴露相应配置，
# 故 vendor 一份源码打两处补丁（改动处均有 `PATCH(gui:overlay-transparency)` 标注）。
#
# 升级 Tauri 时：把 vendor/ 换成新版本源码，重新应用那两处补丁。
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
