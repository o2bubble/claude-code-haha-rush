[package]
name = "claude-gui-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claude-gui-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
jsonrpsee = { version = "0.24", features = ["full", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
claude-gui-shared = { path = "../shared" }
