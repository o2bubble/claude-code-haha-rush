[package]
name = "claude-gui-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claude-gui-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
jsonrpsee = { version = "0.24", features = ["full", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
claude-gui-shared = { path = "../shared" }

# 系统托盘（2026-10-27）。只在 Windows 上启用 —— 托盘是 Windows 专属入口。
[target.'cfg(windows)'.dependencies]
tray-icon = "0.24"
muda = "0.19"
png = "0.17"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
