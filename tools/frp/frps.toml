# frp 服务端配置 —— 跑在**有公网 IP 的机器**上（本项目 = 云 123.56.66.84）
#
# 用法：
#   FRP_TOKEN=<token> ./frps -c frps.toml
#   token 值见 .private/api-keys.md（勿写进本文件，本文件会进仓库）
#
# 环境变量模板语法 {{ .Envs.X }} 是 frp 官方支持的（v0.52+），
# 好处：配置文件可入库，密钥从环境变量注入，不产生明文副本。

bindPort = 7000

# ── 认证 ──
# 必须设！frps 暴露在公网，无 token 时任何人都能把隧道挂上来。
auth.method = "token"
auth.token = "{{ .Envs.FRP_TOKEN }}"

# ── 传输层 ──
# tls 强制加密控制连接（v0.50+ 默认即 true，显式写出便于审查）
transport.tls.force = true

# ── 管理面板（可选，本机调试用；不需要就整段注释）──
# ⚠️ 绑定 127.0.0.1 = 只有 frps 本机能访问（要看请走 SSH 隧道），别改成 0.0.0.0
# 密码复用 FRP_TOKEN —— 少一个要维护的凭据
webServer.addr = "127.0.0.1"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "{{ .Envs.FRP_TOKEN }}"

# ── 日志 ──
log.to = "./frps.log"
log.level = "info"
log.maxDays = 7

# ── 端口白名单（安全加固）──
# 只允许客户端申请这些远端端口，防止有人拿你的服务器开任意端口。
# 按实际需要增删；不设则允许任意端口。
allowPorts = [
  { start = 16000, end = 16099 },
]
