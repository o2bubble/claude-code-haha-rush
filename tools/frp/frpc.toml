# frp 客户端配置 —— 跑在**要暴露服务的机器**上（本项目 = 本机 Windows）
#
# 用法：
#   FRP_TOKEN=<token> ./frpc -c frpc.toml
#
# 原理：frpc **主动出站**连 frps（本机 → 云:7000），
#       所以**不需要本机有公网 IP、不需要开放入站端口**。
#
# ⚠️ 重要前提：本机必须能连通 frps 的公网 IP:端口。
#    本机当前网络（企业管控）限制访问阿里云 IP 段 → 这条路不通，
#    需换网络环境（或换 frps 所在机器）才能真正建连。

serverAddr = "123.56.66.84"
serverPort = 7000

auth.method = "token"
auth.token = "{{ .Envs.FRP_TOKEN }}"

transport.tls.enable = true

log.to = "./frpc.log"
log.level = "info"
log.maxDays = 7

# ─────────────────────────────────────────────────────────────
# 代理规则：每条 = 一个"把本机某端口暴露为 frps 某端口"的映射
#   localIP/localPort  = 本机服务地址
#   remotePort         = 在 frps 机器上对外开放的端口
#                        （须落在 frps.toml 的 allowPorts 区间内）
# ─────────────────────────────────────────────────────────────

# 示例 1：本机 Memory Web（40021）→ 云的 16021
[[proxies]]
name = "memory-web"
type = "tcp"
localIP = "127.0.0.1"
localPort = 40021
remotePort = 16021

# 示例 2：本机 release-platform（8765）→ 云的 18765
# [[proxies]]
# name = "release-platform"
# type = "tcp"
# localIP = "127.0.0.1"
# localPort = 8765
# remotePort = 18765

# 示例 3：本机 SSH（如需从外网 SSR 回来）→ 云的 16022
# ⚠️ 暴露 SSH = 把登录入口开到公网，务必确保密码/密钥强度，或改用密钥认证
# [[proxies]]
# name = "ssh"
# type = "tcp"
# localIP = "127.0.0.1"
# localPort = 22
# remotePort = 16022
