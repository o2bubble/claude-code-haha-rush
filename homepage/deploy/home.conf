# 17lumen 站点 nginx 配置 —— 线上实际生效版本（2026-09-23 起）
# 部署位置：云端 /opt/17lumen/nginx/conf.d/home.conf
# 改配置流程：改本文件 → 上传覆盖云端同名文件 → nginx -t && nginx -s reload
#
# 注：首次部署（证书签发前）用的是「仅 80」版本，由 setup-ssl.sh 第 3 步替换为本文件内容。

server {
    listen 80;
    listen [::]:80;
    server_name 17lumen.com www.17lumen.com 17lumen.cn www.17lumen.cn;

    # 续期校验路径必须保留在 80 端口
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 17lumen.com www.17lumen.com 17lumen.cn www.17lumen.cn;

    ssl_certificate     /etc/letsencrypt/live/17lumen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/17lumen.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
